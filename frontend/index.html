<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ AUTH ============ -->
<main id="auth-screen" class="auth hidden">
  <section class="auth-card">
    <h1 class="brand">Taskflow</h1>
    <p class="auth-lead">Assign work, track progress, get told when something changes.</p>
    <div class="tabs" role="tablist">
      <button class="tab active" data-auth-tab="login" role="tab">Log in</button>
      <button class="tab" data-auth-tab="register" role="tab">Create account</button>
    </div>
    <form id="login-form" class="form" novalidate>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" role="alert"></p>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <form id="register-form" class="form hidden" novalidate>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Email <span class="muted">(optional)</span><input name="email" type="email" autocomplete="email"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required>
        <span class="hint">At least 8 characters.</span></label>
      <p class="form-error" role="alert"></p>
      <button class="btn primary" type="submit">Create account</button>
    </form>
  </section>
</main>

<!-- ============ APP ============ -->
<div id="app-screen" class="hidden">
  <header class="topbar">
    <span class="brand small">Taskflow</span>
    <div class="view-switch" role="group" aria-label="Layout">
      <button data-view="kanban" class="active">Kanban</button>
      <button data-view="cards">Cards</button>
      <button data-view="table">Table</button>
    </div>
    <div class="topbar-right">
      <div class="bell-wrap">
        <button id="bell" class="icon-btn" aria-label="Notifications" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span id="badge" class="badge hidden">0</span>
        </button>
        <section id="notif-panel" class="notif-panel hidden" aria-label="Notifications">
          <div class="notif-head">
            <strong>Notifications</strong>
            <button id="read-all" class="link-btn">Mark all as read</button>
          </div>
          <ul id="notif-list"></ul>
        </section>
      </div>
      <span id="whoami" class="whoami"></span>
      <button id="logout" class="btn ghost">Log out</button>
    </div>
  </header>

  <main class="page">
    <div class="toolbar">
      <div class="tabs filters" id="filters" role="tablist">
        <button class="tab active" data-status="">All</button>
        <button class="tab" data-status="pending">Pending</button>
        <button class="tab" data-status="in_progress">In progress</button>
        <button class="tab" data-status="completed">Completed</button>
      </div>
      <input id="search" type="search" placeholder="Search by title" aria-label="Search by title">
      <button id="new-task" class="btn primary">New task</button>
    </div>
    <div id="board" aria-live="polite"></div>
  </main>
</div>

<!-- ============ CREATE TASK ============ -->
<dialog id="task-dialog">
  <form id="task-form" class="form" method="dialog" novalidate>
    <h2>New task</h2>
    <label>Title<input name="title" maxlength="200" required></label>
    <label>Description<textarea name="description" rows="3"></textarea></label>
    <div class="row">
      <label>Assign to<select name="assigned_to" id="assignee"></select></label>
      <label>Due date<input name="due_date" type="date"></label>
    </div>
    <p class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="cancel-task">Cancel</button>
      <button type="submit" class="btn primary">Create task</button>
    </div>
  </form>
</dialog>

<div id="toasts" aria-live="assertive"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
